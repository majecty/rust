[package]
name = "rtoy-hir"
version = "0.0.1"
edition = "2021"

[dependencies]
# HIR 데이터 + AST → HIR lowering(`lower`)을 함께 둔다 (minimal).
rtoy-ast = { path = "../ast" }
rtoy-span = { path = "../span" }

[dev-dependencies]
# 테스트는 소스 문자열 → lex → lowering → HIR 경로로 HIR을 만든다.
rtoy-lexer = { path = "../lexer" }
rtoy-tokenstream-lowering = { path = "../tokenstream-lowering" }
