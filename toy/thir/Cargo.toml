[package]
name = "rtoy-thir"
version = "0.0.1"
edition = "2021"

[dependencies]
# THIR 데이터 + HIR → THIR lowering/typeck(`lower_crate`)을 함께 둔다 (minimal).
rtoy-hir = { path = "../hir" }
rtoy-span = { path = "../span" }

[dev-dependencies]
# 테스트는 소스 문자열 → lex → lowering → HIR 경로로 THIR을 만든다.
rtoy-lexer = { path = "../lexer" }
rtoy-tokenstream-lowering = { path = "../tokenstream-lowering" }
